name: Daily Bible Reminder

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點執行，API 自行判斷是否發送
  workflow_dispatch:      # 允許手動觸發（測試用）

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notifications
        run: |
          curl -s -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/notify"

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tree Preview</title>
<style>
  body { font-family: sans-serif; background: #f5f5f0; padding: 32px; }
  h2 { font-size: 12px; color: #888; margin: 0 0 16px; letter-spacing: .08em; text-transform: uppercase; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 48px; }
  .card { background: white; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { font-size: 12px; color: #999; }

  /* Fruit popup */
  .fruit-popup { display:none; position:absolute; bottom:0; left:50%; transform:translate(-50%, calc(100% + 10px)); z-index:50; background:white; border-radius:16px; padding:12px 16px; width:200px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .fruit-popup .subtitle { font-size:10px; color:#aaa; margin-bottom:2px; }
  .fruit-popup .name { font-size:15px; font-weight:700; color:#111; margin-bottom:6px; }
  .fruit-popup .verse { font-size:11px; color:#666; line-height:1.6; white-space:pre-line; }
  .tree-wrap { position:relative; display:inline-block; }
  .tree-wrap:focus-within .fruit-popup { display:block; }

  @keyframes sway { 0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)} }
  .sway { animation: sway 4.5s ease-in-out infinite; transform-origin: 100px 246px; }
</style>
</head>
<body>

<script>
  const fruits = {
    '仁愛': '你們要彼此相愛，像我愛你們一樣。\n— 約翰福音 15:12',
    '喜樂': '你們要靠主常常喜樂，我再說，你們要喜樂！\n— 腓立比書 4:4',
    '和平': '我留下平安給你們，我將我的平安賜給你們。\n— 約翰福音 14:27',
    '忍耐': '患難生忍耐，忍耐生老練，老練生盼望。\n— 羅馬書 5:3–4',
    '恩慈': '要以恩慈相待，存憐憫的心，彼此饒恕。\n— 以弗所書 4:32',
    '良善': '你們要嘗嘗主恩的滋味，便知道他是美善。\n— 詩篇 34:8',
    '信實': '那召你們的本是信實的，他必成就這事。\n— 帖撒羅尼迦前書 5:24',
    '溫柔': '溫柔的人有福了，因為他們必承受地土。\n— 馬太福音 5:5',
    '節制': '凡較力爭勝的，諸事都有節制。\n— 哥林多前書 9:25',
  }
  let currentTarget = null
  function showFruit(e, name, verse) {
    e.stopPropagation()
    const popup = document.getElementById('fruit-popup')
    document.getElementById('fp-name').textContent = name
    document.getElementById('fp-verse').textContent = verse
    popup.style.display = 'block'
    // darken clicked fruit
    if (currentTarget) currentTarget.querySelector('circle').setAttribute('fill','#E8593A')
    currentTarget = e.currentTarget
    e.currentTarget.querySelector('circle').setAttribute('fill','#C4432A')
  }
  document.addEventListener('click', () => {
    document.getElementById('fruit-popup').style.display = 'none'
    if (currentTarget) { currentTarget.querySelector('circle').setAttribute('fill','#E8593A'); currentTarget = null }
  })
</script>
</body>
</html>
